name: release cpp docker images

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      image_version:
        description: "Image tag to publish"
        required: true
        default: "manual-test"

permissions:
  contents: read
  packages: write

env:
  DOCKERFILE: Dockerfile.toolchain

  PLATFORMS: linux/amd64,linux/arm64

  DEBIAN_VERSION: bookworm
  UV_VERSION: 0.11.10
  CONAN_VERSION: 2.28.1
  PYTHON_VERSION: 3.12.0

jobs:
  release-images:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: runtime-base
            image: cpp-runtime-base

          - target: runtime-debug-base
            image: cpp-runtime-debug-base

          - target: builder-gcc
            image: cpp-builder-gcc

          - target: dev-gcc
            image: cpp-dev-gcc

          - target: dev-clang
            image: cpp-dev-clang

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "IMAGE_VERSION=${{ github.event.inputs.image_version }}" >> "$GITHUB_ENV"
          else
            echo "IMAGE_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Normalize GitHub owner
        run: |
          OWNER_LOWER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "GHCR_OWNER=${OWNER_LOWER}" >> "$GITHUB_ENV"

      - name: Set Docker Hub namespace
        run: |
          echo "DOCKERHUB_NAMESPACE=${{ secrets.DOCKERHUB_USERNAME }}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          target: ${{ matrix.target }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: |
            DEBIAN_VERSION=${{ env.DEBIAN_VERSION }}
            UV_VERSION=${{ env.UV_VERSION }}
            CONAN_VERSION=${{ env.CONAN_VERSION }}
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
          tags: |
            docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}:${{ env.IMAGE_VERSION }}
            ghcr.io/${{ env.GHCR_OWNER }}/${{ matrix.image }}:${{ env.IMAGE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max